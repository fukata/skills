name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # visual-explain のブラウザを使うテストのため。検査スクリプトは Playwright のキャッシュの chrome-headless-shell を
      # 先に探す。図の文字幅を測るテストは、日本語フォントが無いと結果が変わって失敗する
      - name: ヘッドレス Chrome・日本語フォント・動画の依存を入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
          npx -y playwright install --with-deps chromium-headless-shell
      - name: すべてのスキルのテスト
        run: bash test.sh
        env:
          VISUAL_EXPLAIN_TEST_LOGS: ${{ runner.temp }}/test-logs
      # 要約に出ないトレースバックや配信サーバーのログを、失敗の調査のために残す
      - name: 失敗したテストの出力を保存する
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: ${{ runner.temp }}/test-logs
          if-no-files-found: ignore
          retention-days: 14
