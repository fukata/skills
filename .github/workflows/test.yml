name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # visual-explain のブラウザを使うテストのため。検査スクリプトは Playwright のキャッシュの chrome-headless-shell を
      # 先に探す。図の文字幅を測るテストは、日本語フォントが無いと結果が変わって失敗する
      - name: ヘッドレス Chrome と日本語フォントを入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npx -y playwright install --with-deps chromium-headless-shell
      - name: すべてのスキルのテスト
        run: bash test.sh
